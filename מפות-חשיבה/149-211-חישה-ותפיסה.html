# חישה ותפיסה · עמ' 149–211

## מהי תפיסה
### **תפיסה ↔ מתפס**
- **תפיסה**
  - כל התהליך: לחוש, להבין, לזהות
- **מתפס**
  - התוצאה: החוויה שנתפסה
### שלושה שלבים
- **חישה**
  - קולטנים הופכים גירוי לאות עצבי
- **ארגון התפיסה**
  - ייצוג פנימי: צורה, עומק, גודל
- **זיהוי והיכר**
  - משמעות: "מה זה?"
### **גירוי רחוק ↔ גירוי קרוב**
- **גירוי רחוק**
  - העצם עצמו, בעולם
- **גירוי קרוב**
  - התמונה הדו־ממדית ברשתית
- המשימה: לשחזר רחוק מתוך קרוב
### במוח
- **נוירוני חישה**
  - קולטים מהחושים
- **תלמוס**
  - ממסר לאזור החישה
- **אונת חישה**
  - עורף: ראייה · רקה: שמיעה
- **קורטקס אסוציאטיבי**
  - משלב עם ידע

## כשהתפיסה נכשלת
### **דו־משמעות**
- תמונה אחת, כמה פירושים
- **קוביית נקר**
  - דו־משמעות בארגון
- **ברווז / ארנב**
  - דו־משמעות בזיהוי
- המערכת מעדיפה פירוש אחד
### **אילוזיה**
- המערכת מטעה כמעט את כולם
- **הזיה**
  - מחלה או סמים, לא אצל כולם
- **אילוזיית פונזו**
  - פרספקטיבה: הקו העליון "רחוק"
- **החדר של איימס**
  - טעות במרחק ← טעות בגודל
### **עיוורון לשינוי**
- לא שמים לב לשינויים בולטים
- **שינוי תצורה**
  - הכי קל (94%)
- **חילופי מקום**
  - הכי קשה (65%)
- העולם הוא מקור מידע יציב

## למדוד חישה: פסיכופיזיקה
### **פסיכופיזיקה**
- גירוי פיזיקלי ↔ חוויה
- **גוסטב פכנר**
  - Gustav Fechner, טבע את המונח
### ספים
- **סף מוחלט**
  - הגירוי החלש ביותר: 50% גילוי
- **פונקציה פסיכומטרית**
  - % גילוי לפי עוצמה: צורת S
- **סף ההבדל**
  - ההבדל הקטן ביותר: 50% "שונים"
- **JND**
  - הפער המינימלי המובחן
- **חוק ובר**
  - ΔI/I = k: היחס קבוע
- **הקבוע של ובר**
  - k קטן = רגישות גבוהה
### **הסתגלות חישתית**
- גירוי קבוע ← תגובה יורדת
- שמים לב מהר לחדש
### **תיאוריית גילוי האותות**
- **תהליך חישה**
  - רגישות (מלמטה־למעלה)
- **תהליך החלטה**
  - הטיית תגובה (מלמעלה־למטה)
- **הטיית תגובה**
  - העדפת תשובה, לא בגלל הגירוי
- **פגיעה / החטאה**
  - היה אות: "כן" / "לא"
- **אזעקת שווא / דחייה נכונה**
  - לא היה אות: "כן" / "לא"
### **התמרה**
- אנרגיה ← אות עצבי
- החוש נקבע לפי אזור בקורטקס

## קשב: מה נכנס פנימה
### מי בוחר?
- **בחירה מכוונת־מטרה**
  - אני בוחרת, לפי המטרה
- **לכידה שמקורה בגירוי**
  - הגירוי תופס, אוטומטית
- **עצם חדש**
  - לוכד קשב גם כשמפריע
### מה קורה ללא־קשוב?
- **קיבולת מוגבלת**
  - אי אפשר לעבד הכול
- **מודל הפילטר**
  - ברודבנט: סינון לפני משמעות
- **האזנה דיכוטית**
  - מסר שונה לכל אוזן
- **תופעת מסיבת הקוקטייל**
  - השם שלי עובר את הפילטר
- היום: עיבוד חלקי, בלי מודעות

## ארגון: לקבץ ולחבר
### **דמות ↔ רקע**
- **דמות**
  - מה שבולט קדימה
- **רקע**
  - מה שמאחוריה
### **גשטאלט**
- השלם גדול מסכום חלקיו
- **סמיכות**
  - מה שקרוב, יחד
- **דמיון**
  - מה שדומה, יחד
- **המשכיות טובה**
  - קו ממשיך בצורה חלקה
- **סגירות**
  - משלימים חלק חסר
- **גורל משותף**
  - מה שזז יחד, יחד
### אינטגרציה ותנועה
- **אינטגרציה מרחבית**
  - חיבור מידע ממקומות שונים
- **אינטגרציה של זמן**
  - חיבור מידע מזמנים שונים
- **תפיסת תנועה**
  - קצב גדילה ברשתית = מהירות
- **תופעת פי**
  - שני אורות לסירוגין = תנועה

## ארגון: עומק ועולם יציב
### רמזים דו־עיניים
- **פער בין־רשתי**
  - כל עין רואה תמונה אחרת
- **התכנסות**
  - שרירי העין; עד 3 מטרים
### רמז תנועה
- **היסט תנועה יחסי**
  - כשזזים, הקרוב זז יותר
### רמזי תמונה (עין אחת)
- **הסתרה**
  - המסתיר קרוב יותר
- **גודל יחסי**
  - קטן יותר = רחוק יותר
- **פרספקטיבה קווית**
  - מקבילים מתכנסים לאופק
- **דחיסות המרקם**
  - מרקם צפוף = רחוק
### **קביעויות תפיסה**
- תופסים את הגירוי הרחוק
- **קביעות גודל**
  - גודל ברשתית + מרחק
- **קביעות צורה**
  - מטבע נוטה נשאר עגול
- **קביעות הבהירות**
  - אחוז האור המוחזר קבוע

## זיהוי: לתת משמעות
### שני סוגי עיבוד
- **מלמטה־למעלה**
  - מקורו בנתונים: מהחושים
- **מלמעלה־למטה**
  - מקורו במושגים: ידע וציפיות
- צריך את שניהם
  - רק מלמטה: תקועים בכאן ועכשיו
  - רק מלמעלה: עולם פרטי
### **שחזור פונמי**
- המוח משלים צליל חסר
- **פונמה**
  - יחידת הדיבור הקטנה ביותר
- הצלילים מציעים, ההקשר בוחר
### הקשר וציפיות
- **הקשר**
  - קובע מה נצפה לראות
- מכר במקום לא צפוי
  - קשה לזהות
### **מערך**
- מוכנות זמנית לתפוס או להגיב
- **מערך מוטורי**
  - להגיב מהר (אצן)
- **מערך מנטלי**
  - לפתור לפי כללים
- **מערך תפיסתי**
  - לגלות גירוי (בכי תינוק)
