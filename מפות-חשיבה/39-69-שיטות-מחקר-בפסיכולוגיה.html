# שיטות מחקר בפסיכולוגיה · עמ' 39–69

## תהליך המחקר
### **תיאוריה**
- מערכת מושגים שמסבירה תופעות
- ממנה גוזרים **השערה**
  - טענה שאפשר לבדוק: "אם... אז..."
### **דטרמיניזם**
- לכל התנהגות יש סיבות
- ולכן אפשר לחקור אותה
### 7 שלבים
- 1 תצפית או שאלה
- 2 השערה
- 3 תכנון
- 4 ניתוח ומסקנות
- 5 דיווח על הממצאים
- 6 שאלות פתוחות
- 7 המשך העבודה

## משתנים
### **משתנה**
- גורם שמשתנה בכמות או באיכות
- **ערכים**: מה שהוא יכול לקבל
- פיזיולוגי (לחץ דם) · פסיכולוגי (חרדה)
### **בלתי תלוי**
- הסיבה: מה שהחוקר מפעיל
- **מניפולציה**
  - החוקר קובע מי מקבל איזה ערך
### **תלוי**
- התוצאה: מה שהחוקר מודד
### **הגדרה אופרציונלית**
- מתרגמת מושג מופשט למדידה
- בתלוי: איך מודדים
- בבלתי תלוי: איך יוצרים
- 🎓 מספר + כלי + זמן

## סוגי מחקר
### **ניסוי**
- החוקר **מתפעל** את הבלתי תלוי
- מסקנה: **סיבה ותוצאה**
- **בין נבדקים**
  - קבוצות שונות בתנאים שונים
- **בתוך נבדקים**
  - אותם אנשים בכל התנאים
- **מגבלות**
  - סביבה מלאכותית
  - המשתתפים יודעים שהם בניסוי
  - אתיקה: לא הכול מותר לתפעל
### **מחקר מתאמי**
- החוקר **רק מודד**
- **מקדם מתאם r**
  - סימן = כיוון · מספר = עוצמה
- **מתאם ≠ סיבתיות**
  - לא יודעים מי גורם למי
- מתי: כשאי אפשר לתפעל
### בשניהם
- **מדגם מייצג**
  - דומה לאוכלוסייה שעליה מסיקים

## בעיה ← הליך בקרה
### **הטיית הצופה**
- החוקר רואה את מה שהוא מצפה
- ← **סטנדרטיזציה**
  - אותם תנאים לכל המשתתפים
- ← **הגדרה אופרציונלית**
  - כל חוקר מודד אותו דבר
### **אפקט הציפייה**
- החוקר משדר ציפיות למשתתפים
- 🎓 המרצה: המשתתף מנחש את המטרה
- ← **כפל־עיוורון**
  - החוקר והמשתתף לא יודעים מי באיזו קבוצה
### **אפקט הפלסבו**
- שיפור רק כי מאמינים בטיפול
- ← **בקרת פלסבו**
  - קבוצה עם טיפול לא פעיל, להשוואה
### **הבדלים אישיים**
- הקבוצות שונות כבר מההתחלה
- ← **הקצאה מקרית**
  - הגרלה: לכל אחד סיכוי שווה לכל קבוצה
### 🎓 **אפקט למידה**
- בתנאי השני כבר מכירים את המשימה
- ← **איזון סדר התנאים**
  - חצי מתחילים בתנאי אחד, חצי בשני

## מדידה
### איכות המדד
- **מהימנות**
  - אותה תוצאה במדידה חוזרת
- **תוקף**
  - מודד את מה שהוא אמור למדוד
- לא מהימן ← לא תקף
### סוגי מדדים
- **דיווח עצמי**
  - המשתתף מספר במילים על עצמו
  - שאלון, סקר, ריאיון
  - בעיה: **רצייה חברתית**
    - עונים מה שנראה טוב
- **מדדי התנהגות**
  - פעולות גלויות שאפשר לראות ולתעד
  - **תצפית**
    - צופים ומתעדים בשיטתיות
  - **נתונים ארכיוניים**
    - רשומות שכבר קיימות
  - **ניתוח מקרה**
    - אדם אחד או קבוצה קטנה, לעומק

## אתיקה
### 📘 העיקרון הראשון
- לעזור ולא לפגוע
### 4 סוגיות
- **הסכמה מדעת**
  - לפני: מסבירים, והמשתתף מסכים
- **רווח מול הפסד**
  - האם התועלת מצדיקה את הסיכון
- **הטעיה מכוונת**
  - מותרת רק ב־4 תנאים
- **שיחת הבהרה**
  - אחרי: מסבירים הכול, גם את ההטעיה
### בעלי חיים
- כל חוקר חייב להצדיק את המחקר
- הצעה: לחקור בסביבה הטבעית

## צרכנית מחקר נבונה
- **מתאם ≠ סיבתיות**
  - קשר לא מוכיח שאחד גורם לשני
- **"בהשוואה למה?"**
  - יש קבוצת ביקורת?
- **הסברים חלופיים**
  - אולי משהו אחר גרם לתוצאה?
- **הגדרה אופרציונלית**
  - מה בדיוק נמדד?
- **חשדנות בתשובה פשוטה**
  - סיבה אחת ופתרון אחד לשאלה מורכבת
