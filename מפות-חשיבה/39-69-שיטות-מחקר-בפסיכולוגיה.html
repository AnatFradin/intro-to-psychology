# שיטות מחקר בפסיכולוגיה · עמ' 39–69

## תהליך המחקר
### **תיאוריה** ← **השערה**
### **דטרמיניזם**: לכל התנהגות יש סיבות
### 7 שלבים
- 1 תצפית או שאלה
- 2 השערה
- 3 תכנון
- 4 ניתוח ומסקנות
- 5 דיווח וביקורת עמיתים
- 6 שאלות פתוחות
- 7 המשך המחקר

## משתנים
- **משתנה** ← **ערכים**
  - פיזיולוגי · פסיכולוגי
- **בלתי תלוי**: הסיבה
  - **מניפולציה**: החוקר קובע
- **תלוי**: התוצאה, נמדד
- **הגדרה אופרציונלית**: מושג ← מדידה
  - 🎓 מספר + כלי + זמן

## סוגי מחקר
### ניסוי
- יש **מניפולציה**
- מסקנה: **סיבה ותוצאה**
- **בין נבדקים**: קבוצות שונות
- **בתוך נבדקים**: אותם אנשים
- מגבלות: מלאכותי · אתיקה
### מחקר מתאמי
- **רק מודדים**
- **מקדם מתאם r**: כיוון ועוצמה
- **מתאם ≠ סיבתיות**
- כשאי אפשר לתפעל
### בשניהם
- **מדגם מייצג** ← אוכלוסייה

## בעיה ← הליך בקרה
### הטיית הצופה
- **סטנדרטיזציה**
- **הגדרה אופרציונלית**
### אפקט הציפייה
- **כפל־עיוורון**
### אפקט הפלסבו
- **בקרת פלסבו**
### הבדלים אישיים בין קבוצות
- **הקצאה מקרית**
### 🎓 אפקט למידה
- **איזון סדר התנאים**

## מדידה
### איכות המדד
- **מהימנות**: תוצאה עקבית
- **תוקף**: מודד את מה שצריך
- לא מהימן ← לא תקף
### סוגי מדדים
- **דיווח עצמי**: שאלון, ריאיון
- **מדדי התנהגות**: תצפית, ארכיון, ניתוח מקרה

## אתיקה
- 📘 **העיקרון הראשון**: לעזור ולא לפגוע
- **הסכמה מדעת**: לפני
- **רווח מול הפסד**
- **הטעיה מכוונת**: 4 תנאים
- **שיחת הבהרה**: אחרי
- **בעלי חיים**

## צרכנית מחקר נבונה
- "בהשוואה למה?"
- לחפש הסברים חלופיים
- לבדוק הגדרות ומקור
