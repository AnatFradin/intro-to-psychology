# שיטות מחקר בפסיכולוגיה · עמ' 39–69

## 1. תהליך המחקר (7 שלבים)
- **1** תצפית או שאלה
- **2** השערה: "אם... אז..."
- **3** תכנון המחקר
- **4** ניתוח ומסקנות
- **5** דיווח: פרסום וביקורת עמיתים
- **6** שאלות פתוחות
- **7** המשך העבודה
- **תיאוריה**: מסבירה תופעות
- **דטרמיניזם**: לכל התנהגות יש סיבות
- 📖 בייסבול: הכדור נראה גדול יותר

## 2. אובייקטיביות ומשתנים
### הטיית הצופה
- רואים את מה שמצפים
- 📖 מונסטרברג (Münsterberg) · הכוס
### התיקון להטיית הצופה
- **מניפולציה**: מה שונה בין הקבוצות
- **סטנדרטיזציה**: מה זהה לכולם
- **אופרציונליזציה**: איך בדיוק עושים ומודדים
### משתנים
- **משתנה** ← **ערכים**
- פיזיולוגי: לחץ דם
- פסיכולוגי: חרדה, זיכרון
- מופשט ← הגדרה אופרציונלית
- **בלתי תלוי**: מה שמפעילים (סיבה)
- **תלוי**: מה שמודדים (תוצאה)
- 📖 קפאין ← זיכרון (Ryan, 2002)

## 3. ניסוי ובקרה
- **מטרה**: סיבה ותוצאה
- **הסבר חלופי** ← **משתנה מתערב**
### שני משתנים מתערבים
- **אפקט ציפייה**: החוקר משדר (📖 החולדות)
- **אפקט פלסבו**: המשתתף מאמין (70%)
### הליכי בקרה
- **כפל־עיוורון** ← נגד ציפייה
- **בקרת פלסבו**: "בהשוואה למה?"
- 📖 ג'ינקו: שתי הקבוצות 14%
- **הקצאה מקרית** ← נגד הבדלים אישיים
### מערכים
- **בין נבדקים**: קבוצות שונות
- **בתוך נבדקים**: אותם אנשים
- 📖 התינוקות והטלוויזיה
- **מדגם מייצג** ↔ אוכלוסייה
### 📖 מסרים תת־ספיים (237 משתתפים)
- אין שיפור אמיתי
- שיפור נתפס לפי התווית = פלסבו
### מגבלות הניסוי
- סביבה מלאכותית
- משתתפים יודעים
- בעיות אתיות

## 4. מחקר מתאמי
- כשאי אפשר לתפעל
- **מקדם מתאם r**: מ־1- עד 1+
- **סימן** = כיוון · **מספר** = עוצמה
- 📖 כדורסל (+) · גולף (−)
- **מתאם ≠ סיבתיות**
- 📖 שינה וציונים · קונפליקט בין אחים

## 5. מדדים
### איכות המדד
- **מהימנות**: תוצאה עקבית
- **תוקף**: מודד את מה שצריך
- לא מהימן ← לא תקף
- 📖 מספר נעליים: מהימן, לא תקף
### דיווח עצמי
- שאלון / סקר: פתוחות · רב־בררה
- ריאיון: מובנה · פתוח
- בעיה: מרצייה חברתית
- 📖 בלייר: שאלות סקר משנות עמדות
### מדדי התנהגות
- תצפית ישירה
- תצפית בסביבה הטבעית (📖 גודול, Goodall)
- נתונים ארכיוניים (📖 65.8% נשים)
- ניתוח מקרה (📖 נזק מוחי)

## 6. אתיקה
- **להיטיב ולא להזיק** (APA)
- **הסכמה מדעת**: לפני
- **רווח מול הפסד**
- **הטעיה מכוונת**: 4 תנאים
- **שיחת הבהרה**: אחרי
- בעלי חיים: 📖 80% בעד תצפית טבעית

## 7. צרכנית מחקר נבונה
- מתאם ≠ סיבתיות
- הגדרות אופרציונליות
- לנסות להפריך
- הסברים חלופיים
- "בהשוואה למה?"
- ברשת: לבדוק את המקור
- ביקורת עמיתים: 69% נדחו
