# במה עוסקים הפסיכולוגים? (עמ' 25–29)

## תחומי התמחות (טבלה 1.2)
### בריאות נפשית ושיקום
- **קליניים, יועצים, קהילתיים, פסיכיאטרים**: התמודדות עם קשיי היום־יום, אבחון וטיפול
- **שיקומיים**: אחרי שבץ מוחי, לקות
- **רפואיים**: "חולה לפני כל בחינה", אורח חיים, לחץ
### מחקר בסיסי
- **ביולוגיים, פסיכו־פרמקולוגים**: זיכרונות במוח, ביוכימיה
- **ניסויים, מנתחי התנהגות**: אילוף כלב, ניסויים בבעלי חיים
- **קוגניטיביים**: שכחה, זיכרון, שפה, החלטות
- **אישיותיים, גנטיקאים התנהגותיים**: הבדלים בין אנשים
- **חברתיים**: לחץ קבוצתי
- **התפתחותיים**: תינוקות, שינויים לאורך כל החיים
### יישום בשטח
- **תעשייתיים־ארגוניים, תעסוקתיים**: עבודה מדכאת
- **חינוכיים, של בית הספר**: תלמידים מפריעים
- **משפטיים**: שפיות של נאשם
- **ספורט**: "נחנק" במשחק חשוב

## מחקר ↔ יישום
- **מחקר**: חיפוש תובנה חדשה
- **יישום**: תרגום התובנה לחיי היום־יום
- **חייב להיות קשר** ביניהם
- גם **קליניים** עושים מחקר (אבחנה מבדלת, טיפול מיטבי)

## הפסיכולוגים בעולם
- **500,000+** פסיכולוגים
- **IUPsyS**: ארגונים מ־70 ארצות
- **APA**: 150,000+
- **APS**: 14,000+, דגש **מדעי**
### סביבות עבודה (תרשים 1.2)
- **עצמאיים 33.6%**
- **אקדמיה 28%**
- בתי חולים ומרפאות 19.4%
- אחר 8.5%
- עסקים וממשלה 6.3%
- בתי ספר 4.2%

## נשים בפסיכולוגיה
- **מרגרט וושברן** (1894, קורנל): הדוקטורט הראשון לאישה, *התודעה של בעלי החיים*
- **מרי קלקינס** (1895, הרווארד): לא קיבלה תואר כי הייתה אישה, **נשיאת APA הראשונה**
- **אנה פרויד**: פסיכואנליזה

## ארבע מטרות הפסיכולוגיה (מדריך, שאלה 9)
- **לתאר**: מה קורה?
- **להסביר**: למה?
- **לנבא**: מתי ואצל מי?
- **לפקח**: איך משנים?
