# זיכרון · עמ' 320–368

## מהו זיכרון
### **זיכרון**
- עיבוד מידע, כמו מחשב
### שלושה תהליכים
- **קידוד**
  - עיבוד ראשוני: יוצרים ייצוג
- **ייצוג מנטלי**
  - העולם בתוך הראש
- **אחסון**
  - שמירה לאורך זמן
- **שליפה**
  - הוצאה כשצריך
- **הידור ידע**
  - עובדות הופכות לפעולה אוטומטית
### **מודל המאגרים המרובים**
- אטקינסון ושיפרין, 1968
- חושי ← עבודה ↔ לטווח ארוך

## מאגרים לזמן קצר
### **זיכרון איקוני**
- זיכרון חושי חזותי
- קיבולת גדולה, פחות משנייה
- **דיווח חלקי**
  - שורה אחת לפי צליל
  - מוכיח: הכול נכנס
- **השהיית הצליל**
  - מוכיחה: המידע דועך
- **זיכרון צילומי (צורני)**
  - נמשך זמן רב; ילדים מעטים
### **זיכרון לטווח קצר**
- מחזיק מעט, לזמן קצר
- **טווח הזיכרון**
  - 7±2 פריטים (מילר)
- קיבולת טהורה: 3–5
### **זיכרון עבודה**
- מחזיק ומעבד (באדלי)
- **לולאה פונולוגית**
  - מידע מבוסס דיבור
- **לוח חזותי־מרחבי**
  - מידע חזותי ומרחבי
- **מנגנון הבקרה המרכזי**
  - קשב ותיאום
- **טווח זיכרון העבודה**
  - המילה האחרונה בכל משפט

## הבעיה: קיבולת קטנה ← הפתרון
### נגד דעיכה
- **שינון לשם תחזוקה**
  - חוזרים שוב ושוב
- **מטלת הסחה**
  - מונעת שינון: נשכח ב־18 שניות
### נגד עומס
- **מקבץ**
  - יחידת מידע בעלת משמעות
- **הקבצה**
  - מארגנים פריטים לקבוצות
### לטווח ארוך
- **שינון מעמיק**
  - מעשירים: קשר, סיפור, דימוי
- **נמוניות**
  - רמזי שליפה מוכנים מראש
- **טכניקת המקומות**
  - פריטים לאורך מסלול מוכר
- **טכניקת מילות המפתח**
  - חרוזים: אחת – מבט
- **אפקט הבא בתור**
  - לא זוכרים את הקודם לנו

## סוגי זיכרון לטווח ארוך
### **זיכרון לטווח ארוך**
- המחסן של כל הידע
### **תהליכי ↔ מוצהר**
- **זיכרון תהליכי**
  - איך עושים; אוטומטי
- **זיכרון מוצהר**
  - עובדות ואירועים, במילים
### **אפיזודי ↔ סמנטי**
- **זיכרון אפיזודי**
  - אירועים שחוויתי: זמן ומקום
- **זיכרון סמנטי**
  - עובדות ומשמעויות
### **מטלות גלויות ↔ חבויות**
- **זיכרון גלוי**
  - מאמץ מודע להיזכר
- **זיכרון חבוי**
  - בלי מאמץ מודע; נבדק בעקיפין
- **למידה מכוונת / מקרית**
  - יודעים שצריך לזכור / לא
- מטלות חבויות
  - השלמת מילה, גזע, זיהוי, אנגרמות
### **הטרמה**
- גירוי קודם מקל על הבא
- **הטרמת חזרה**
  - אותה מילה שוב
- **הטרמה סמנטית / אסוציאטיבית**
  - מילה קשורה: רופא ← אחות

## שליפה: רמזים והקשר
### **רמזי שליפה**
- הגירויים שעוזרים למצוא זיכרון
- **זמן החזקה**
  - עד שבודקים את הזיכרון
### **היזכרות ↔ היכר**
- **היזכרות**
  - להפיק בעצמי
- **היכר**
  - לזהות מה שכבר ראיתי
- היכר בדרך כלל קל יותר
### **ייחודיות הקידוד**
- הקשר שליפה = הקשר קידוד
- צוללנים: מים או חוף
- רק הקשר **מובחן** עוזר
### **אפקט המיקום הסדרתי**
- **אפקט הראשונות**
  - זוכרים את ההתחלה
- **אפקט האחרונות**
  - זוכרים את הסוף
- **היזכרות לפי סדר / חופשית**
  - בסדר המקורי / בכל סדר
- **מובחנות ההקשר**
  - ההסבר: פסי רכבת

## שכחה ועיוות
### **עקומת השכחה**
- אבינגהאוס, 1885
- **הברות תפל**
  - מדד טהור, בלי משמעות
- **למידה בעזרת שינון**
  - חזרה מכנית עד שאין טעויות
- **שיטת החיסכון**
  - כמה פחות צעדים בלמידה מחדש
- מהר בהתחלה, ואז מתייצבת
### **הפרעה**
- זיכרונות מתחרים
- **הפרעה למאוחר**
  - ישן מפריע לחדש: קידוד
- **הפרעה למוקדם**
  - חדש מפריע לישן: שליפה
### עדי ראייה
- **אפקט המידע המטעה**
  - מידע אחרי האירוע משנה זיכרון
- לופטוס: "התנגשו" או "מגע"
- גם אזהרה לא עוזרת

## הזיכרון במוח
### **אנגרם**
- הייצוג הפיזי של הזיכרון
- לאשלי: מפוזר, לא במקום אחד
### ארבעה מבנים
- **מוחון**
  - תהליכי, התניה קלאסית
- **סטריאטום**
  - הרגלים, גירוי־תגובה
- **קליפת המוח**
  - זיכרונות חושיים
- **היפוקמפוס ואמיגדלה**
  - מוצהר ורגשי
### **שיכחון**
- **שיכחון למאוחר**
  - אין זיכרונות חדשים (ניק א')
- **שיכחון למוקדם**
  - אובדים זיכרונות מלפני
- **דיסוציאציה**
  - גלוי נפגע, חבוי שמור
### הדמיה מוחית
- **PET**
  - קידוד שמאל, שליפה ימין
- **fMRI**
  - היפוקמפוס: קידוד מול שליפה
### **אלצהיימר**
- הזיכרון הולך ומתמוטט
- **עמילואיד בתא־פפטיד**
  - רובד שקוטל תאי עצב
