# פסיכולוגיה חברתית · עמ' 856–939

## תפיסה חברתית: איך מסבירים אחרים
### **ייחוס**
- **הבניית המציאות החברתית**
  - כל אחד מפרש אירוע אחרת
- **ייחוס נטייתי / פנימי**
  - הסיבה באדם
- **ייחוס מצבי / חיצוני**
  - הסיבה במצב
- **היידר**
  - Heider: "פסיכולוג אינטואיטיבי"
### קלי: שלוש שאלות
- **עקרון ההשתנות המשותפת**
  - הסיבה נוכחת ↔ ההתנהגות מופיעה
- **ייחודיות**
  - רק במצב הזה?
- **עקיבות**
  - תמיד במצב הזה?
- **הסכמה**
  - גם אחרים עושים כך?
### שתי הטיות
- **טעות הייחוס הבסיסית**
  - על אחרים: מגזימים בפנימי
  - החידון: השואל "גאון"
  - חזקה במערב (עצמי עצמאי)
- **הטיה בשירות העצמי**
  - הצלחה = אני · כישלון = המצב
### ציפייה ← מציאות
- **נבואה המגשימה את עצמה**
  - הציפייה גורמת לעצמה לקרות
- **אפקט פיגמליון**
  - בכיתה: "מבטיחים" עלו ב־IQ
- **אישור התנהגותי**
  - האחר מתנהג כמו שציפו
- המעגל
  - אמונה ← התנהגות ← אמונת האחר ← התנהגותו

## עמדות: מה הן ומתי מנבאות
### **עמדה**
- הערכה חיובית או שלילית של מושא
- **A: רגש**
  - מה אני מרגישה
- **B: התנהגות**
  - מה עשיתי בעבר
- **C: קוגניציה**
  - מה אני חושבת ויודעת
### מתי עמדה מנבאת התנהגות?
- **נגישות**
  - עולה מהר לזיכרון ← מנבאת
- **ספציפיות**
  - עמדה ספציפית ← התנהגות ספציפית

## שינוי עמדות: שלוש דרכים
### מבחוץ: **שכנוע**
- **מודל סבירות העיבוד**
  - כמה חושבים על המסר
- **מסלול מרכזי**
  - התוכן · מוטיבציה ויכולת
- **מסלול היקפי**
  - רמזים שטחיים · בלי מאמץ
- להתאים טיעון לסוג העמדה
  - רגשי ↔ רגשי, ענייני ↔ ענייני
### מבפנים: ההתנהגות משנה עמדה
- **דיסוננס קוגניטיבי**
  - סתירה ← אי־נוחות ← שינוי
  - דולר אחד > 20 דולר
- **תיאוריית התפיסה העצמית**
  - בם: מסיקה עמדה מההתנהגות
  - אין עמדה קודמת, אין אי־נוחות
### ללחוץ "כן": **היענות**
- **נורמת ההדדיות**
  - נתנו לי ← אחזיר
- **טכניקת הדלת בפרצוף**
  - בקשה גדולה ← ויתור ← קטנה
- **תחושת המחויבות**
  - הסכמתי פעם ← אהיה עקבית
- **טכניקת רגל בדלת**
  - בקשה קטנה ← גדולה
- **עקרון הנדירות**
  - מה שנדיר נראה שווה יותר

## דעות קדומות: בעיה ← מקור ← פתרון
### הבעיה: **דעה קדומה**
- עמדה נלמדת ושלילית כלפי קבוצה
- **A: עוינות**
  - הרכיב הרגשי
- **B: אפליה**
  - הרכיב ההתנהגותי
- **C: סטריאוטיפ**
  - הרכיב הקוגניטיבי
### המקור: **קטגוריזציה חברתית**
- מיון אנשים לקבוצות
- **קבוצות פנים / חוץ**
  - "אנחנו" מול "הם"
- **הטיית קבוצת פנים**
  - שלנו טובים יותר (גם בצבעים)
- **גזענות / סקסיזם**
  - אפליה לפי מוצא / מין
### מה מחזיק אותה: **סטריאוטיפים**
- הכללה: כולם אותו דבר
- משלימים "נתונים חסרים"
- מידע סותר מקבל ערך נמוך
- **איום סטריאוטיפ**
  - הסטריאוטיפ פוגע בביצוע שלי
### הפתרון: מטרה משותפת
- **המחנה של שריף**
  - תחרות ← אלימות · שיתוף ← חברות
- **השערת המגע**
  - מגע + תלות הדדית + מטרה משותפת
- **טכניקת התצרף**
  - ארונסון: כל ילד מחזיק חלק
- מגע לבד או מידע לבד ← לא עובד

## כוחו של המצב
### **תפקיד חברתי** ו**כלל**
- **תפקיד חברתי**
  - דפוס התנהגות שמצפים ממני
- **כלל**
  - הנחיה מפורשת או משתמעת
- **סטנפורד**
  - זימברדו: מטבע ← סוהר אכזר
### **נורמה חברתית**
- ציפיות הקבוצה מחבריה
- לומדים מאחידות ומעונשים
### **קונפורמיות**: שני כוחות
- **השפעת המידע**
  - רוצים לצדוק · מצב עמום
- **התגבשות נורמה**
  - שריף: האור "זז", הנורמה נשארת
- **השפעת הנורמה**
  - רוצים שיחבבו · גם כשברור
- **הניסוי של אש**
  - שליש נכנעו · שותף אחד מציל
### **השפעת המיעוט**
- מוסקוביצ'י: מיעוט עקבי
- משנה בפרטי, דרך מידע
### **קיטוב קבוצתי**
- הקבוצה קיצונית יותר מהפרטים
- **מודל השפעת המידע**
  - כל אחד מוסיף מידע לאותו צד
- **מודל ההשוואה החברתית**
  - רוצים להיראות "חבר אמיתי"
### **ציות לסמכות**
- מילגרם (מהמדריך)
- עמית מציית ← 92%
- שתי סמכויות סותרות ← כ־2%
- קרבה לקרבן ← יורד

## תוקפנות: חמש גישות
### **תוקפנות**
- נזק פסיכולוגי או פיזי לזולת
### חברתית־קוגניטיבית
- **שטאוב**
  - משבר ← קבוצת חוץ אשמה
- **דה־הומניזציה**
  - "הם לא בני אדם"
### אבולוציונית
- הישרדות: בני זוג ומשאבים
- **לורנץ**
  - לאדם אין עכבה: יונה עם מקור עורב
- ביקורת: גם שימפנזים הורגים
### ביולוגית ואישיותית
- גנים: פיזית 50%–60% · חברתית 20%
- אמיגדלה · MAOA · סרוטונין
- **קורטיזול נמוך**
  - פחות עקה שמרסנת
- **תוקפנות אימפולסיבית**
  - רגש, בלהט הרגע
- **תוקפנות אינסטרומנטלית**
  - כלי להשגת מטרה
### מצבית
- **השערת התסכול והתוקפנות**
  - מטרה נחסמת ← תוקפנות
- **חום**
  - יותר חם ← יותר תקיפות (בערב)
- **התגרות ישירה**
  - מרגיזים אותי בכוונה
- **הסלמה**
  - דרישה ← כעס ← עלבון
- **תסריט הסלמה**
  - הרצף שהתרבות מלמדת
### חברתית־תרבותית
- **עצמי תלוי**
  - פוגע בי = פוגע בעצמי ← פחות תוקפנות
- **תרבות של כבוד**
  - דרום ארה"ב: עלבון ← תגובה חריפה
- **מודל התוקפנות הכללי**
  - אלימות בתקשורת ← "העולם מסוכן"
