# תהליכים קוגניטיביים · עמ' 375–434

## מהי קוגניציה ואיך חוקרים
### מושגי יסוד
- **קוגניציה**
  - כל צורות הידיעה
- **תכנים ↔ תהליכים**
  - מה יודעים ↔ איך מפעילים
- **פסיכולוגיה קוגניטיבית**
  - התחום בתוך הפסיכולוגיה
- **מדעי הקוגניציה**
  - בין־תחומי: פילוסופיה, מוח, מחשב
### לפתוח את "הקופסה השחורה"
- **זמן תגובה**
  - עוד צעד מנטלי = עוד זמן
- **דונדרס (1868)**
  - משווים מטלות שנבדלות בצעד
- **קטגוריזציה של גירויים**
  - עיצור או תנועה?
- **בחירת תגובה**
  - לסמן C או V?
- **כשלים**
  - טעויות חושפות תהליכים

## סידור התהליכים ומשאבים
### איך מסודרים?
- **תהליכים סדרתיים**
  - בזה אחר זה
- **תהליכים מקבילים**
  - חופפים בזמן
- זמן תגובה לא תמיד מבחין
### כמה משאבים?
- **משאבים מנטליים**
  - כוח עיבוד מוגבל
- **תהליכי קשב**
  - מחלקים את המשאבים
- **תהליכים מבוקרים**
  - דורשים קשב, אחד בכל פעם
- **תהליכים אוטומטיים**
  - בלי קשב, במקביל
- **אימון**
  - מבוקר הופך לאוטומטי
- **עיבוד מספרים**
  - כמות אוטומטית, גם כשמפריע

## שפה: הדובר מפיק
### מה מתכוונים
- **משמעות המשפט**
  - המילים כפשוטן
- **משמעות הדובר**
  - מה שהדובר מתכוון
### מתאימים את המסר לשומע
- **הפקת שפה**
  - מה אומרים ואיך יוצרים מסר
- **עיצוב על־פי קהל**
  - לפי הידע של המאזין
- **עקרון שיתוף הפעולה**
  - גרייס: כמות, איכות, קשר, סגנון
- **בסיס משותף**
  - הידע שחולקים עם המאזין
- **חברות בקהילה**
  - אנחנו מאותה קהילה
- **נוכחות משותפת בפעולות**
  - עשינו או אמרנו יחד
- **נוכחות משותפת בתפיסה**
  - רואים את זה עכשיו
### טעויות דיבור חושפות תכנון
- **ספונריזם**
  - החלפת הצלילים הראשונים
- **שלוש רמות תכנון**
  - מילה, מקום, צליל
- **טכניקת SLIP**
  - מילים אמיתיות: יותר טעויות
- **מיזוג ביטויים**
  - משמעות דומה מקושרת בזיכרון

## שפה: המאזין מבין
### בעיה: דו־משמעות
- **דו־משמעות מילונית**
  - מילה, כמה פירושים ("אח")
- **דו־משמעות מבנית**
  - מבנה המשפט, כמה פירושים
### פתרון: ההקשר
- **הקשר**
  - מקום, נושא, סיפור
- **במוח**
  - אזורים נוספים פעילים (fMRI)
- המאזין מצפה לשיתוף פעולה
### מה נשאר בזיכרון
- **היגדים**
  - הרעיונות המרכזיים שנאמרו
- הנוסח המדויק נשכח
- **היסק**
  - משלימים את מה שלא נאמר
- **תמונת מצב**
  - קובעת אילו היסקים

## שפה: מבנה, אבולוציה ותרבות
### מרכיבי השפה (מדריך)
- **תחביר**
  - צירוף וסדר המילים
- **סמנטיקה**
  - משמעות המילים והמשפטים
- **פרגמטיקה**
  - משמעות בשימוש ובהקשר
- **מורפולוגיה**
  - מבנה המילים
- **פונולוגיה**
  - הצלילים והיחסים ביניהם
### רק לבני אדם?
- **חומסקי**
  - יכולת מולדת, לא רק חיקוי
- **דקדוק**
  - אין־סוף משפטים: רק אדם
- **קנזי (בונובו)**
  - מבין מילים, בלי כללים
- **קופי הירוק**
  - לפי מי הקהל, לא מה יודע
### שפה ← חשיבה
- **יחסות לשונית**
  - מבנה השפה משפיע על החשיבה
- **ספיר ווורף**
  - גרסה קיצונית
- **תפיסה קטגוריאלית**
  - דומה בתוך קטגוריה של השפה
- **הימבה**
  - "בורואו": כחול וירוק יחד

## שיפוט: היריסטיקות
### למה קיצורי דרך?
- **רציונליות מוגבלת**
  - משאבים מוגבלים: "טוב מספיק"
- **שיפוט**
  - לגבש דעה ומסקנה
- **היריסטיקה**
  - כלל אצבע, קיצור דרך
- בדרך כלל עובד
- טעויות חושפות, כמו אילוזיות
### היריסטיקת הזמינות
- מה שקל להיזכר בו
- **בעיה א: הזיכרון מטה**
  - האות k, מצב רוח
- **בעיה ב: מידע מוטה מראש**
  - תקשורת, שינוי תשובות
- פתרון: לבדוק את מצב הרוח
### היריסטיקת היציגות
- נראה טיפוסי ← שייך
- **הבעיה**
  - מתעלמים ממבנה ומהסתברות
- **עורך הדין**
  - טניס בתוך משחק כדור
- פתרון: לבדוק את כל החלופות
### היריסטיקת העיגון
- תיקון לא מספיק מערך התחלתי
- **עוגן לא רלוונטי**
  - מספר זיהוי מטה
- פתרון: עוד מאמץ בתיקון

## קבלת החלטות
### המסגרת משנה החלטה
- **קבלת החלטות**
  - בחירה בין חלופות
- **העדפה ↔ ביטול**
  - חיובי ↔ שלילי
- **מסגרת**
  - תיאור מסוים של הבעיה
- **נקודות ייחוס**
  - רווח או הפסד לפי ציפייה
- **רווח ↔ הפסד**
  - הישרדות ↔ תמותה
- פתרון: לחשוב בשתי המסגרות
### אחרי ההחלטה
- **חרטה**
  - בעיקר לימודים וקריירה
- **רתיעה מהחלטה**
  - לא להחליט, כדי לא להתחרט
- **שתי אפשרויות טובות**
  - יותר דחייה
### סגנונות
- **מסתפקים**
  - "טוב מספיק", מרוצים יותר
- **מחפשי שלמות**
  - "הכי טוב": יותר כסף, פחות סיפוק
