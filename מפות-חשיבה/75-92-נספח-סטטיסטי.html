# נספח סטטיסטי · עמ' 75–92

## 1. 📖 המחקר: רוצחי פתע
- 19 אסירים: 10 רוצחי פתע, 9 רגילים
- **השערה**: רוצחי פתע ביישנים יותר
- שאלון ביישנות: כן / לא
- BSRI: "נשיות" מול "גבריות"
- MMPI: שליטת־יתר של האני

## 2. שני סוגי סטטיסטיקה
- **נתונים גולמיים**: הציונים עצמם
- **תיאורית**: מה יש לנו?
- **היסקית**: אמיתי או מקרי?

## 3. איך הנתונים מתפלגים
- **התפלגות שכיחויות**: כמה מכל ציון
- **דיאגרמת מקלות**: קטגוריות עם שמות
- **היסטוגרמה**: מרווחים מספריים
- 📖 8 מתוך 10 ביישנים, מול 1 מתוך 9

## 4. מיקום מרכזי
- **שכיח**: הכי נפוץ
- **חציון**: באמצע, לא רגיש לקיצוניים
- **ממוצע**: M = ΣX/N, רגיש לקיצוניים
- 📖 11.5 ← 15.5 בגלל ציון אחד

## 5. פיזור
- **טווח**: גבוה פחות נמוך
- **סטיית תקן**: מרחק ממוצע מהממוצע
- **ציון סטייה**: X − M
- SD קטנה ← הממוצע מייצג טוב
- 📖 24.6 מול 10.7

## 6. מיקום יחסי וקשר
- **מאון**: כמה אחוזים מתחתיי
- **ציון תקן z**: (X − M)/SD
- 📖 אותו 14: z שלילי מול חיובי
- **מקדם מתאם r**: 📖 0.35+

## 7. היסק
### עקומה נורמלית
- פעמון סימטרי
- ממוצע = חציון = שכיח
- 68% בסטיית תקן אחת
- 📖 IQ: ממוצע 100, SD 16
### מובהקות
- **רמת מובהקות**: 0.05
- **מבחן t**: הבדל בין שני ממוצעים
- 📖 תפקידי מין: p < .05 מובהק
- 📖 שליטת־יתר: p < .10 לא מובהק
### צרכנית נבונה
- מי במדגם? כמה גדול?
- ציון קיצוני ← חציון
- פיזור, מובהקות, מהימנות ותוקף
