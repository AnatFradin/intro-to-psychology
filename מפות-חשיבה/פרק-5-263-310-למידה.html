# למידה · עמ' 263–310

## מהי למידה
### **למידה**
- שינוי קבוע יחסית בהתנהגות
- מבוסס על התנסות
### מה זה לא
- **בשילה**
  - שינוי ביולוגי מההתפתחות
- **הבחנה בין למידה לביצוע**
  - לומדים גם בלי שרואים
### **התרגלות**
- התגובה יורדת לגירוי שחוזר
- ≠ הסתגלות חישתית
### שלוש גישות
- **ביהביוריסטית**
  - הסביבה: זיווג, חיזוק
- **ביולוגית**
  - המטען הגנטי מגביל
- **קוגניטיבית**
  - ייצוג ועיבוד של ידע

## הביהביוריזם
### **ביהביוריזם** (ווטסון)
- **התנהגות ניתנת לצפייה**
  - רק מה שרואים
- **אינטרוספקציה**
  - נדחתה: סובייקטיבית
### **ביהביוריזם רדיקלי** (סקינר)
- **גורמים של התנהגות**
  - בסביבה, לא בנפש
### **ניתוח התנהגות**
- חוקים אוניברסליים לכל המינים
- לכן מחקר בבעלי חיים

## התניה קלאסית: גירוי ↔ גירוי
### מרכיבים
- **רפלקס**
  - תגובה טבעית לגירוי חשוב
- **גירוי בלתי־מותנה (UCS)**
  - מעורר תגובה בלי למידה
- **תגובה בלתי־מותנית (UCR)**
  - התגובה המולדת ל־UCS
- **גירוי מותנה (CS)**
  - ניטראלי שזווג עם UCS
- **תגובה מותנית (CR)**
  - התגובה הנלמדת ל־CS
- **זיווג חוזר**
  - CS ו־UCS שוב ושוב
### תהליכים
- **רכישה**
  - ה־CR מופיעה ומתחזקת
- **הכחדה**
  - CS בלי UCS: ה־CR נעלמת
- **החלמה ספונטנית**
  - אחרי מנוחה ה־CR חוזרת
- **הכללת הגירוי**
  - מגיבים גם לגירויים דומים
- **מדרג הכללה**
  - דומה יותר = תגובה חזקה
- **הבחנה בין גירויים**
  - מגיבים רק למנבא
### תזמון
- **התניה מושהית**
  - CS נמשך עד UCS: הכי יעילה
- **התניית עקבה**
  - CS נגמר לפני UCS
- **התניה בו־בזמן**
  - יחד: חלשה
- **התניה לאחור**
  - CS אחרי UCS: חלשה
### מתי נוצרת?
- **סמיכות זמנים**
  - פבלוב: קרובים בזמן
- **ניבוי**
  - רסקורלה: CS מנבא באמינות
- **מידע נוסף**
  - קמין: מנבא קודם חוסם
### יישומים
- **התניה לפחד**
  - אלברט הקטן: חולדה + רעש
- **פרסום**
  - מוצר + גירוי מושך
- **סבילות לסמים**
  - הסביבה = CS, תגובת נגד = CR
- **כימותרפיה**
  - המרפאה מעוררת עייפות

## התניה אופרנטית: תגובה ↔ תוצאה
### היסודות
- **חוק התוצאה**
  - תוצאה טובה מגבירה תגובה
- **ניסוי וטעייה**
  - תורנדייק: חתולים בתיבה
- **אופרנט**
  - התנהגות שמשפיעה על הסביבה
- **תא אופרנטי**
  - סקינר: לחיצה על דוושה
### **תלות משולשת**
- **גירוי מבחין**
  - מסמן מתי יש חיזוק
- התנהגות ← תוצאה
- גם כאן הכללה
### קלאסית מול אופרנטית
- **הקישור**
  - גירוי־גירוי / תגובה־תוצאה
- **הלומד**
  - פסיבי / אקטיבי
- **המניע**
  - UCR / חיזוק ועונש

## תוצאות ומחזקים
### מגבירים
- **חיזוק חיובי**
  - מוסיפים משהו נעים
- **חיזוק שלילי**
  - מורידים משהו לא נעים
- **התניית בריחה**
  - בורחים מגירוי שכבר כאן
- **התניית הימנעות**
  - מונעים גירוי מראש
### מקטינים
- **עונש חיובי**
  - מוסיפים משהו לא נעים
- **עונש שלילי**
  - לוקחים משהו נעים
- **הכחדה אופרנטית**
  - מפסיקים לחזק
### סוגי מחזקים
- **מחזקים ראשוניים**
  - ביולוגיים: מזון, מים
- **מחזקים מותנים**
  - נלמדים: כסף, ציונים
- **כלכלת אסימונים**
  - אסימונים תמורת התנהגות רצויה
### חיזוק שמזיק
- **מודל הכפייה**
  - איומים ריקים ← תוקפנות
- **רווחים משניים**
  - תשומת לב משמרת סימפטום
### תכניות חיזוקים
- **חיזוק חלקי**
  - רק חלק מהתגובות
- **השפעת החיזוק החלקי**
  - עמיד יותר להכחדה
- **יחס קבוע (FR)**
  - מספר תגובות קבוע: הפסקות
- **יחס משתנה (VR)**
  - ממוצע תגובות: הכי מהיר
- **רווח קבוע (FI)**
  - זמן קבוע: דפוס מסולסל
- **רווח משתנה (VI)**
  - זמן ממוצע: יציב

## גבולות ביולוגיים
### **מגבלות ביולוגיות על למידה**
- המטען הגנטי של המין
- נגד "חוק אחד לכולם"
### **סחף אינסטינקטיבי**
- נלמד נסחף לאינסטינקט
- בהתניה אופרנטית
### **סלידה נלמדת מטעם**
- טעם + בחילה: ניסיון אחד
- גם אחרי שעות
- טעם ↔ בחילה, אור ↔ כאב
### **מוכנות ביולוגית**
- פחות התנסויות לקשר מסוים
- פחד מנחשים ועכבישים

## קוגניציה
### **קוגניציה**
- ייצוג ועיבוד של ידע
- **קוגניציה של בעלי חיים**
  - גם לבעלי חיים יש
### **מפה קוגניטיבית**
- טולמן: ייצוג פנימי של המבוך
- בוחרים מסלול שלא חוזק
### התנהגות מושגית
- יונים מסווגות קטגוריות
- נבדק בתמונות חדשות
### **למידה באמצעות צפייה**
- **חיזוק מתווך**
  - רואים אחר מקבל חיזוק
- **עונש מתווך**
  - רואים אחר נענש
- **מודל**
  - מתוגמל, אהוד, דומה, בולט
- **הקהיה רגשית**
  - פחות עוררות מול אלימות
