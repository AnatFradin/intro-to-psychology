# היסודות הביולוגיים של ההתנהגות · עמ' 96–143

## תורשה ואבולוציה
### **בררה טבעית**
- מי שמתאים לסביבה שורד ומתרבה
- **שונות**
  - ההבדלים בין הפרטים
- **סביבה**
  - בוחרת מי שורד
- **תורשה**
  - מעבירה את התכונה לצאצאים
### **גנוטיפ ↔ פנוטיפ**
- **גנוטיפ**
  - המבנה הגנטי שירשנו
- **פנוטיפ**
  - מה שרואים בפועל: גנים + סביבה
- לא אחד־לאחד
  - עיניים חומות משני גנוטיפים
### אבולוציה אנושית
- **עמידה זקופה**
  - ידיים פנויות לכלים
- **מוח גדול**
  - חשיבה ותכנון
- **שפה**
  - להעביר ידע לאחרים
- **התפתחות תרבותית**
  - הסתגלות מהירה דרך למידה
### מהתא עד הגן
- **כרומוזומים**
  - 46 בכל תא, חצי מכל הורה
- **דנ"א**
  - הגדיל שממנו בנוי הכרומוזום
- **גן**
  - קטע דנ"א: הוראות לחלבון
- **כרומוזומי המין**
  - XX נקבה, XY זכר
### **תורשתיות**
- כמה תכונה עוברת בגנים (0–1)
- **מחקרי תאומים**
  - זהים דומים יותר? לגנים יש חלק
- **מונוזיגוטים**
  - ביצית אחת, גנים זהים
- **דיזיגוטים**
  - שתי ביציות, כחצי מהגנים
- תורשתיות גבוהה ≠ גורל

## הנוירון
### המבנה
- **דנדריטים**
  - קולטים
- **גוף התא**
  - משלב את המידע
- **אקסון**
  - מוליך לאורכו
- **כפתורים סופיים**
  - מעבירים לנוירון הבא
### שלושה סוגים
- **סנסוריים**
  - מהחושים פנימה
- **אינטרנוירונים**
  - מתווכים בין נוירונים
- **מוטוריים**
  - פקודה לשרירים ולבלוטות
### **רפלקס הרתיעה**
- המעגל נסגר במוח השדרה
- היד זזה לפני שכואב
### **תאי גלייה**
- תמיכה בנוירונים
- **מיילין**
  - בידוד שמאיץ את ההולכה
- **מחסום דם־מוח**
  - חוסם רעלים
- הכוונה וניקיון

## איך עובר מסר
### בתוך הנוירון: חשמלי
- **פוטנציאל פעולה**
  - דחף חשמלי לאורך האקסון
- **חוק הכול־או־לא־כלום**
  - מעל הסף יורה, תמיד באותו גודל
- **עוצמת גירוי**
  - יותר יריות ויותר נוירונים
- **טרשת נפוצה**
  - פגיעה במיילין
### בין נוירונים: כימי
- **סינפסה**
  - הרווח בין שני נוירונים
- **נוירוטרנסמיטרים**
  - חומרים שחוצים את המרווח
- **קולטנים**
  - מפתח ומנעול
  - הקולטן קובע: עירור או עיכוב
- עיכוב של עיכוב = עירור
### נוירוטרנסמיטרים
- **אצטילכולין**
  - זיכרון, כיווץ שרירים
- **גאבא**
  - המעכב העיקרי; מעט = חרדה
- **נורפינפרין**
  - מצב רוח
- **דופמין**
  - תנועה, סכיזופרניה, פרקינסון
- **סרוטונין**
  - מצב רוח, עוררות
- **אנדורפינים**
  - שליטה בכאב
### "זה גנטי"?
- גן ← דופמין ← תכנון ← אימפולסיביות
- השפעה עקיפה
- צריך **הגדרה אופרציונלית**

## שתי מערכות שליטה
### מערכת העצבים
- **מרכזית**
  - מוח + מוח השדרה
- **היקפית**
  - כל העצבים שמחוץ להן
- **סומטית**
  - רצונית: שרירי השלד
- **אוטונומית**
  - לא רצונית: איברים פנימיים
- **סימפטטית**
  - חירום: לחימה או מנוסה
- **פרסימפטטית**
  - שגרה ותחזוקה
### **מערכת אנדוקרינית**
- **הורמונים**
  - שליחים כימיים בדם
- אטית ומתמשכת
- **היפותלמוס**
  - מפעיל את יותרת המוח
- **יותרת המוח**
  - "בלוטת העל": מפעילה את כל הבלוטות

## מבני המוח
### I גזע המוח
- **מוח מוארך**
  - נשימה, דופק, לחץ דם
- **גשר**
  - מעביר מידע למוחון
- **תצורת הרשת**
  - ערנות וקשב לגירוי חדש
- **תלמוס**
  - ממסר של מידע חושי
- **מוחון**
  - שיווי משקל ותיאום תנועה
### II המערכת הלימבית
- **היפוקמפוס**
  - זיכרונות חדשים
- **אמיגדלה**
  - רגש ופחד
- **היפותלמוס**
  - אכילה, חום, איזון פנימי
### III המוח הגדול
- **אונת המצח**
  - תנועה, תכנון, החלטות
- **אונת הקדקוד**
  - מגע, כאב וחום
- **אונת העורף**
  - ראייה
- **אונת הרקה**
  - שמיעה והבנת שפה
- **קורטקס מוטורי** · **סומטו־סנסורי**
  - מוצלב והפוך
### שתי המיספרות
- **כפיס המוח**
  - הגשר בין הצדדים
- **חצויי מוח**
  - הגשר נותק
  - שדה שמאלי ← לא יכולים לומר
- **שמאל**
  - דיבור, ניתוח פרטים
- **ימין**
  - התמונה השלמה, תובנה

## המוח משתנה
- **גמישות**
  - המוח משתנה מהתנסות
  - סביבה מועשרת · כנרים
- **תאי גזע**
  - תאים שעוד לא התמחו
- **נוירוגנזה**
  - נוירונים חדשים, גם בבוגרים

## איך חוקרים את המוח
### התערבות
- **פציעה קיימת**
  - לומדים ממי שנפגע
- **ניתוח לאחר המוות**
  - בודקים את המוח אחרי המוות
- **פגע ממוקד**
  - פגיעה מכוונת, רק בבעלי חיים
- **rTMS**
  - השבתה זמנית, בבני אדם
- **גרייה ישירה**
  - זרם חשמלי חלש באזור
### רישום והדמיה
- **EEG**
  - פעילות חשמלית מהקרקפת
- **PET**
  - איפה יש פעילות
- **MRI**
  - איך המוח בנוי
- **fMRI**
  - מבנה + תפקוד
